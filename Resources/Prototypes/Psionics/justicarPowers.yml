- type: psionicPower
  id: WhisperTruthPower
  name: Whisper Truth
  powerCategories:
  - Mentalic
  - Dangerous
  initializeFunctions:
  - !type:AddPsionicActions
    actions:
    - ActionWhisperTruth
  - !type:AddPsionicPowerComponents
    components:
    - type: WhisperTruthPower
  - !type:PsionicFeedbackPopup
  - !type:PsionicFeedbackSelfChat
    feedbackMessage: Such terrible things there are in this world.
  - !type:PsionicModifyGlimmer
    glimmerModifier: 2.5
  - !type:AddPsionicAssayFeedback
    assayFeedback: I have seen something I can never turn back from. Its Broken. Its Broken. Its Broken. Its Broken.
  - !type:AddPsionicStatSources
    amplificationModifier: 1
  removalFunctions:
  - !type:RemovePsionicActions
  - !type:RemovePsionicPowerComponents
    components:
    - type: WhisperTruthPower
  - !type:RemovePsionicStatSources
  - !type:RemoveAssayFeedback
    assayFeedback: Something horrible has been revealed to me...

