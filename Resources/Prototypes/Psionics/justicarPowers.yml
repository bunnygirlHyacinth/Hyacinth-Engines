# ACTIONS --- ORGANIZE THESE GOOD PLEASE <33

- type: entity
  id: ActionPsionicAssault
  name: Psionic Assault
  description: Teach the wicked. Show them pain.
  categories: [ HideSpawnMenu ]
  components:
    - type: EntityTargetAction
      icon: Interface/VerbIcons/dispel.png
      useDelay: 30
      range: 10
      itemIconStyle: BigAction
      blacklist:
        components:
          - PsionicInsulation
          - Mindbroken
      event: !type:PsionicAssaultPowerActionEvent

- type: entity
  id: ActionWhisperTruth
  name: Whisper Truth
  description: There are some things left better unsaid.
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTargetAction
    icon: Interface/VerbIcons/telegnosis.png
    useDelay: 30
    range: 5
    itemIconStyle: BigAction
    blacklist:
      components:
      - PsionicInsulation
      - Mindbroken
    event: !type:WhisperTruthPowerActionEvent

- type: entity
  id: ActionScrambleCipher
  name: scramble cipher recitation
  description: scramble your psyche to prevent outside intervention
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTargetAction
    icon: Interface/Actions/eyeclose.png
    useDelay: 15
    range: 5
    itemIconStyle: BigAction
    blacklist:
      components:
      - PsionicInsulation
      - Mindbroken
    event: !type:ScrambleCipherPowerActionEvent
