- type: entity
  name: captain's rapier
  parent: [ BaseSword, BaseCommandContraband ]
  id: CaptainRapier
  description: A very traditional parade rapier designed for the captain of the station.
  components:
  - type: Sprite
    sprite: _Gardenstation/Objects/Weapons/Melee/captain_rapier.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -15
    attackRate: .8
    range: 1.8
    soundHit:
      path: /Audio/SimpleStation14/Weapons/Melee/rapierhit.ogg
    damage:
      types:
        Slash: 5
        Piercing: 15
    clickPartDamageMultiplier: 3
    heavyPartDamageMultiplier: 2.5
    heavyRateModifier: 1.25
    lightRangeModifier: 1.25
    heavyDamageBaseModifier: 1
    heavyStaminaCost: 2.5
    maxTargets: 4
    angle: 30
    animation: WeaponArcThrust
  - type: DamageOtherOnHit
    staminaCost: 5
  - type: EmbeddableProjectile
  - type: EmbedPassiveDamage
  - type: ThrowingAngle
    angle: 225
  - type: Reflect
    reflectProb: .3
    spread: 65
  - type: Item
    size: Normal
    sprite: _Gardenstation/Objects/Weapons/Melee/captain_rapier.rsi
  - type: Tag
    tags:
    - CaptainRapier
  - type: DisarmMalus
    malus: 0.225
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-inanimate
    weight: 0.02 # 5,000 times less likely than 1 regular animal
  - type: FrenchAccent
  - type: SolutionContainerManager # poison tipped rapier?? its peak??? the bastard noble has no honor????
    solutions:
      melee:
        maxVol: 2
  - type: MeleeChemicalInjector
    solution: melee
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: SolutionInjectOnEmbed
    transferAmount: 2
    solution: melee
  - type: SolutionTransfer
    maxTransferAmount: 2
#bso rapier - change this later to be less messy
- type: entity
  name: blue shield officer's vibro-rapier #shitcode sorry
  parent: [ BaseSword, BaseCommandContraband, BlueshieldMace ]
  id: BsoVibroRapier
  description: A platinum rapier hilt fitted with a high-tech vibroblade, quite common to see used by inner-spindle aristocracy and their bodyguards. A reflex trainer is fitted in its grip.
  components:
  - type: Sprite
    sprite: _Gardenstation/Objects/Weapons/Melee/bso_vibrorapier.rsi
    layers:
    - state: icon-off
      map: [ "enum.ToggleVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleVisuals.Toggled:
        enum.ToggleVisuals.Layer:
          True: { state: icon }
          False: { state: icon-off }
  - type: Reflect # make this have .4 unpowered and .9 powered
    reflectProb: .5 # fuck all life
    spread: 30
  - type: ItemToggle
    soundActivate:
      path: /Audio/Machines/button.ogg
      params:
        volume: -3
    soundDeactivate:
      collection: sparks
      params:
        volume: -4
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Shock: 2 # the blade conducts a small amount of power from the built-in reactor ?? idk. just flavor.
        Slash: 15
        Piercing: 15
    ignoreResistances: true
    activatedSoundOnSwing: # vibrosword go wrrrrrrm
      path: /Audio/Weapons/eblademiss.ogg
      params:
        volume: -3
    activatedSoundOnHit:
      path: /Audio/Weapons/eblade1.ogg
      params:
        volume: -3
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
        volume: -10
  - type: MeleeWeapon
    wideAnimationRotation: -15
    attackRate: .8 # do you enjoy hurting other people?
    range: 1.8
    soundHit:
      path: /Audio/Weapons/Melee/rapierhit.ogg # turning on the kill mode makes the disabled sound stop working and i dont know why
      params:
        volume: 2
    damage:
      types:
        Piercing: 15
    clickPartDamageMultiplier: 1.5
    heavyPartDamageMultiplier: 1
    heavyRateModifier: 1.25
    lightRangeModifier: 1.25
    heavyDamageBaseModifier: 1.1
    heavyStaminaCost: 5
    maxTargets: 5
    angle: 40
    animation: WeaponArcThrust
  - type: StaminaDamageOnHit
    damage: 5
    overtime: 5
    sound: /Audio/Weapons/egloves.ogg
  - type: StaminaDamageOnCollide
    damage: 5
    overtime: 5
    sound: /Audio/Weapons/egloves.ogg
  - type: DamageOtherOnHit
    staminaCost: 5
  - type: EmbeddableProjectile
  - type: EmbedPassiveDamage
  - type: ThrowingAngle
    angle: 225
  - type: Item
    size: Normal
    sprite: _Gardenstation/Objects/Weapons/Melee/bso_vibrorapier.rsi
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 50 # i dont even want this to have a battery but it just doesnt work unless i do it like this so i mite kms instead
  - type: Tag
    tags:
    - BsoRapier
  - type: DisarmMalus
    malus: 0.125
  - type: MeleeSpeech # DO NOT RESIST! DO NOT RESIST!! DO NOT RESIST!!!
  - type: ActivatableUI
    key: enum.MeleeSpeechUiKey.Key
    verbOnly: true
  - type: Actions
  - type: UserInterface
    interfaces:
      enum.MeleeSpeechUiKey.Key:
        type: MeleeSpeechBoundUserInterface

