- type: entity
  name: Sister's Staff
  parent: BaseMeleeWeaponEnergy
  id: OspreyStaff
  description: A holy staff and psychic focus used by the coven for their rituals. This one seems especially powerful...
  components:
  - type: EnergySword
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: EmbedPassiveDamage
  - type: ItemTogglePointLight
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/firepunch1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/eblade1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnSwing:
      path: /Audio/Weapons/eblademiss.ogg
      params:
        variation: 0.125
        volume: -10
    activatedDamage:
      types:
        Psionic: 15
        Heat: 15
        Blunt: 15
  - type: ItemToggle
    soundActivate:
      path: /Audio/Magic/staff_animation.ogg
    soundDeactivate:
      path: /Audio/Magic/ethereal_exit.ogg
  - type: Tag
    tags:
    - Spear
  - type: ComponentToggler
    components:
    - type: Sharp
    - type: DisarmMalus
      malus: 0.6
    - type: Execution
      doAfterDuration: 4.0
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.40,-0.30
          - -0.30,-0.40
          - 0.40,0.30
          - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sharp
  - type: Sprite
    sprite: _Gardenstation/Objects/Weapons/Melee/osprey_staff.rsi
    layers:
    - state: staff
    - state: staff-blade
      visible: false
      shader: unshaded
      map: [ "blade" ]
  - type: MeleeWeapon
    wideAnimationRotation: -135
    range: 1.75
    damage:
      types:
        Blunt: 7
        Psionic: 5
    heavyRateModifier: 1.3
    heavyRangeModifier: 1.35
    heavyDamageBaseModifier: 1.0
    heavyStaminaCost: 2.5
    maxTargets: 3
    angle: 20
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/genhit1.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 10
        Psionic: 10
    staminaCost: 6
  - type: Item
    size: Ginormous
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 5
        Heat: 5
        Psionic: 15
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30 #excess damage avoids cost of spawning entities.
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: UseDelay
  - type: Appearance
  - type: ToggleableLightVisuals
    spriteLayer: blade
    inhandVisuals:
      left:
      - state: wielded-inhand-left-blade
        shader: unshaded
        visible: true
      right:
      - state: wielded-inhand-right-blade
        shader: unshaded
        visible: true
  - type: SurgeryTool # wild but the Visage should be able to come in and kinda do whatever. Theyre like 8 steps above anything the station can comprehend. this is just multitool basically :P
    startSound:
      path: /Audio/_Goobstation/Heretic/crack2.ogg
    endSound:
      path: /Audio/Items/welder.ogg
  - type: Hemostat
    speed: 2
  - type: Scalpel
    speed: 2
  - type: Drill
    speed: 2
  - type: BoneSetter
    speed: 2
  - type: Retractor
    speed: 2
  - type: Cautery
    speed: 2
  - type: BoneGel
    speed: 2
  - type: BoneSaw
    speed: 2
  - type: Tweezers
    speed: 2
  - type: Tending
    speed: 2
