- type: entity
  name: Biesel Republic flag
  parent: BaseItem
  id: BieselRepFlag
  description: The torch of liberty burns eternal and bright!
  components:
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: EmbedPassiveDamage
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.40,-0.30
          - -0.30,-0.40
          - 0.40,0.30
          - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sharp
  - type: Sprite
    sprite: _Gardenstation/Objects/Weapons/Melee/bieselflag_weapon.rsi
    layers:
    - state: biesel-icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    range: 1.75
    damage:
      types:
        Blunt: 7 # its flagpole idk
        piercing: 1
    heavyRateModifier: 1.3
    heavyRangeModifier: 1.35
    heavyDamageBaseModifier: 1.0
    heavyStaminaCost: 2.5
    maxTargets: 3
    angle: 20
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 10
    staminaCost: 6
  - type: Item
    size: Ginormous
  - type: Clothing
    sprite: _Gardenstation/Objects/Weapons/Melee/bieselflag_weapon.rsi
    equippedPrefix: biesel
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 2
        Blunt: 3
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30 #excess damage avoids cost of spawning entities.
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: UseDelay
  - type: Appearance
