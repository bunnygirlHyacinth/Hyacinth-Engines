- type: entity
  parent: [BaseItem, BaseCommandContraband]
  abstract: true
  id: ConsulateRadio
  name: Consular Communicator
  description: Request assistance in your consular duties from your government. While they are useful, they are not protected by directive 12 like you are!
  components:
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: radio
  - type: UserInterface
    interfaces:
      enum.GhostRoleRadioUiKey.Key:
        type: GhostRoleRadioBoundUserInterface
  - type: ActivatableUI
    key: enum.GhostRoleRadioUiKey.Key
#bodyguards // the current ghostrole thingy doesnt let you make like 3 guys at once which is annoying. we split them up instead for better selection by the consul.
- type: entity
  parent: ConsulateRadio
  id: ReinforcementRadioBiesel
  name: Biesel DSS Communicator
  description: Call in a DSS provided bodyguard from the Republic of Biesel.
  components:
  - type: GhostRole
    name: ghost-role-information-biesel-bodyguard-reinforcement-name
    description: ghost-role-information-biesel-bodyguard-reinforcement-description
    rules: ghost-role-information-consulate-bodyguard-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: RandomHumanoidSpawnerBieselBodygaurd

