#misc

- type: entity
  parent: RingBase
  id: GoldenDeepRingID
  name: Midas Collective signet
  description: Shiny and valuable!
  components:
  - type: Sprite
    sprite: Clothing/Hands/Rings/basic.rsi
    layers:
    - state: ring
    - state: gem
      map: [ "gemColor" ]
  - type: StaticPrice
    price: 2000
  - type: Appearance
  - type: RandomSprite
    getAllGroups: true
    available:
    - gemColor:
        gem: Rainbow
  - type: Access
    tags:
    - ConsularOfficer
    - GoldenDeep
    - CentralCommand
