#small flags // replace this with a modular flag system maybe?
- type: entity
  parent: N14SignBase
  id: Ar13WallFlagBiesel
  name: flag
  suffix: Biesel
  description: The flag of the Biesel Republic.
  components:
  - type: Sprite
    sprite: _Gardenstation/Structures/Wallmounts/wallmounts.rsi
    state: bieselflag
  - type: Construction
    graph: BieselBanner
    node: bieselbannerfull
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20 #With the damage modifier you should have a hard time getting through it with something blunt, but an axe or something flammable will do the trick.
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
