- type: entity
  parent: ClothingOuterBase
  id: ClothingMagicalGirlCorpoChestplate
  name: Corporate MagiDress
  description: Never let their efforts be in vain.
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: AllowSuitStorage
  - type: Sprite
    sprite: _Gardenstation/Clothing/OuterClothing/Modsuits/magicalgirlcco.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Magic/ethereal_enter.ogg
    unequipSound: /Audio/Magic/ethereal_exit.ogg
    slots: [ outerClothing ]
  - type: ClothingSpeedModifier
    walkModifier: 1.1
    sprintModifier: 1.1
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-chestplate
    sealDownPopup: sealable-clothing-seal-down-chestplate
  - type: SealableClothingVisuals
    visualLayers:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
        shader: unshaded
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.3
        Slash: 0.3
        Piercing: 0.3
        Heat: 0.3
        Radiation: 0.001
        Caustic: 0.3
        Holy: 0.3
        Psionic: 0.3
        #Soul: eventually this will be real with actual magical girls the crew can play/roll roundstart (and the antags that deal it)
  - type: ComponentToggler
    components:
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      heatingCoefficient: 0.1
      coolingCoefficient: 0.1

# sec suit

- type: entity
  parent: ClothingModsuitChestplateStandard
  id: ClothingModsuitChestSquire
  name: Squire modsuit chestplate
  description: A light modular chestplate, keeps you safe and quick on your feet!
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: AllowSuitStorage
  - type: Sprite
    sprite: _Gardenstation/Clothing/OuterClothing/Modsuits/secoff_modsuit.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ outerClothing ]
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-chestplate
    sealDownPopup: sealable-clothing-seal-down-chestplate
  - type: SealableClothingVisuals
    visualLayers:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
        Radiation: 0.6
  - type: ComponentToggler
    components:
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      heatingCoefficient: 0.1
      coolingCoefficient: 0.1
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: FireProtection
    reduction: 0.5

