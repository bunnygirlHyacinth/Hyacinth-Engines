- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltJusticarPsychalBelt
  name: justicar's psychal belt
  description: The belt seems to wrap itself around anything you press up against it...
  components:
  - type: Sprite
    sprite: _Gardenstation/Clothing/Belt/justicar_psychal_belt.rsi
  - type: Clothing
    sprite: _Gardenstation/Clothing/Belt/justicar_psychal_belt.rsi
  - type: Storage
    grid:
    - 0,0,15,1

- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase, BaseCommandContraband]
  id: ClothingBeltCapRapier
  name: captain's rapier sheath
  description: An ornate sheath designed to hold an officer's foil.
  components:
  - type: Sprite
    sprite: _Gardenstation/Clothing/Belt/captain_rapier_sheath.rsi
    state: sheath
  - type: Clothing
    sprite: _Gardenstation/Clothing/Belt/captain_rapier_sheath.rsi
  - type: Item
    size: Large
  - type: ItemSlots
    slots:
      item:
        name: Rapier
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/SimpleStation14/Items/Handling/sword_sheath.ogg
        ejectSound: /Audio/SimpleStation14/Items/Handling/sword_unsheath.ogg
        whitelist:
          tags:
          - CaptainRapier
  - type: ItemMapper
    mapLayers:
      sheath-rapier:
        whitelist:
          tags:
          - CaptainRapier
  - type: Appearance

- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase, BaseCommandContraband]
  id: ClothingBeltBsoVibroRapier
  name: blueshield officer's rapier sheath
  description: Live by the sword, die by the sword. Honor has no place among dead men.
  components:
  - type: Sprite
    sprite: _Gardenstation/Clothing/Belt/bso_rapier_sheath.rsi
    state: sheath
  - type: Clothing
    sprite: _Gardenstation/Clothing/Belt/bso_rapier_sheath.rsi
  - type: Item
    size: Large
  - type: ItemSlots
    slots:
      item:
        name: Rapier
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/SimpleStation14/Items/Handling/sword_sheath.ogg
        ejectSound: /Audio/SimpleStation14/Items/Handling/sword_unsheath.ogg
        whitelist:
          tags:
          - BsoRapier
  - type: ItemMapper
    mapLayers:
      sheath-rapier:
        whitelist:
          tags:
          - BsoRapier
    sprite: _Gardenstation/Clothing/Belt/bso_rapier_sheath.rsi
    state: sheath-rapier-equipped-BELT
  - type: Appearance
  - type: ClothingSlowOnDamageModifier
    modifier: 0.8
  - type: ClothingModifyStunTime # die on your feet
    modifier: 0.8
