# HELMET

- type: entity
  parent: ClothingHeadBase
  id: ClothingMKIVTacSuitHelmet
  name: Mk. IV tacsuit helmet
  description: A robust helmet made specifically to stop any close range attacks
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Gardenstation/Clothing/Head/ModularArmor/sec_markIV_tacsuit.rsi
    state: icon
  - type: Clothing
    sprite: _Gardenstation/Clothing/Head/ModularArmor/sec_markIV_tacsuit.rsi
    layers:
    - state: equipped-HELMET
    equipSound: /Audio/Items/Equip/toolbelt_equip.ogg
    unequipSound: /Audio/Items/jumpsuit_equip.ogg
    slots: [ head ]
  - type: IngestionBlocker
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.95
  - type: ExplosionResistance
    damageCoefficient: 0.9
