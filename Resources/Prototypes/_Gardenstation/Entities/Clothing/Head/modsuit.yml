- type: entity
  parent: [ BaseClothingModsuitHelmet, ShowSecurityIcons, ShowMedicalIcons ]
  id: ClothingMagicalGirlCorpoHelmet
  name: Corporate MagiBeret
  description: From now on, never regret anything- ever again!
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Gardenstation/Clothing/Head/Modsuits/magicalgirlcco.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      map: [ "sealed" ]
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-helmet
    sealDownPopup: sealable-clothing-seal-down-helmet
  - type: SealableClothingVisuals
    visualLayers:
      head:
      - state: equipped-HEAD-sealed
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.4
        Slash: 0.4
        Piercing: 0.4
        Heat: 0.4
        Radiation: 0.001
        Caustic: 0.4
        Holy: 0.4
        Psionic: 0.4
  - type: ComponentToggler
    components:
    - type: BreathMask
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      heatingCoefficient: 0.1
      coolingCoefficient: 0.1
    - type: IdentityBlocker
    - type: IngestionBlocker
    - type: HideLayerClothing
      slots:
      - Hair
  # This will all be replaced by modules later
  - type: NightVision
    isEquipment: true
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Inorganic
  - type: SolutionScanner
  - type: ShowSyndicateIcons
  - type: FlashImmunity
  - type: EyeProtection
  - type: Tag
    tags:
    - PlasmamanSafe
    - Envirohelm
  - type: IgniteFromGasImmunity
    parts:
    - Head

#sec suit

- type: entity
  parent: BaseClothingModsuitHelmet
  id: ClothingModsuitHelmetSquire
  name: Squire modsuit helmet
  description: A robust modsuit helmet, its even got a vomit flush!
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Gardenstation/Clothing/Head/Modsuits/secoff_modsuit.rsi
    layers:
    - state: helmet
    - state: helmet-sealed
      visible: false
      map: [ "sealed" ]
  - type: HideLayerClothing # This helmet don't have sprite on unsealed state
    slots:
    - Snout
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-helmet
    sealDownPopup: sealable-clothing-seal-down-helmet
  - type: SealableClothingVisuals
    visualLayers:
      head:
      - state: equipped-HEAD-sealed
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
        Radiation: 0.6
  - type: ComponentToggler
    components:
    - type: BreathMask
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      heatingCoefficient: 0.1
      coolingCoefficient: 0.1
    - type: IdentityBlocker
    - type: IngestionBlocker
    - type: HideLayerClothing
      slots:
      - Hair
      - Snout
      - HeadTop
      - HeadSide
  # This will all be replaced by modules later
  - type: ToggleableLightVisuals
  - type: PointLight
    enabled: false
    radius: 3
    energy: 2
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    netsync: false
  - type: HandheldLight
    addPrefix: true
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      id: radiating
      interpolate: Linear
      maxDuration: 2.0
      startValue: 3.0
      endValue: 2.0
      isLooped: true
      reverseWhenFinished: true
    - !type:PulseBehaviour
      id: blinking
      interpolate: Nearest
      maxDuration: 1.0
      minValue: 0.1
      maxValue: 2.0
      isLooped: true
  - type: Battery
    maxCharge: 600 # Lights drain 3/s but recharge of 2 makes this 1/s, therefore 600 is 10 minutes of light
    startingCharge: 600
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 2
  - type: Tag
    tags:
    - PlasmamanSafe
    - Envirohelm
  - type: IgniteFromGasImmunity
    parts:
    - Head

- type: entity
  parent: ClothingModsuitHelmetSquire
  id: ClothingModsuitHelmetHOS
  name: Centurion hardsuit modhelm
  description: A heavy parade helmet, fitted with gold and painted in security colors. Theres a europan craftsmen seal tucked away inside the collar
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Gardenstation/Clothing/Head/Modsuits/hos_modsuit.rsi
