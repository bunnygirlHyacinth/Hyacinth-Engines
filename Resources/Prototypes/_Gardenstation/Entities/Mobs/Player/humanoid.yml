#BIESEL
- type: randomHumanoidSettings
  id: BieselBodyguard
  randomizeName: false
  parent: EventHumanoidMindShielded
  speciesBlacklist: # just matches the CO requirements
  - Shadowkin # there is a solarian saying
  - Monkey
  - Kobold
  - Abductor
  - Xelthia
  - Rodentia #rodentia last names are broken i guess
  - Vox # they die instantly
  - Arachnid # spiders scare me
  - Plasmaman # they die instantly
  - Tajaran # biesel COs cant be tajarans, DSS agents probably cant either...
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: GhostRole
    name: ghost-role-information-biesel-bodyguard-reinforcement-name
    description: ghost-role-information-biesel-bodyguard-reinforcement-description
    requirements:
    - !type:CharacterOverallTimeRequirement
      time: 18000 #5 hours
    - !type:CharacterDepartmentTimeRequirement
      department: Medical
      time: 7200 #2 hours
    - !type:CharacterDepartmentTimeRequirement
      department: Security
      time: 7200 #2 hours
  - type: GhostTakeoverAvailable
  - type: Loadout
    prototypes: [ BieselRepBodyguard ]
  - type: RandomMetadata
    nameSegments:
    - NamesFirstAgentDSS
    - names_last

- type: entity
  id: RandomHumanoidSpawnerBieselBodygaurd
  categories: [HideSpawnMenu]
  name: Biesel Bodygaurd
  components:
  - type: RandomHumanoidSpawner
    settings: BieselBodyguard


