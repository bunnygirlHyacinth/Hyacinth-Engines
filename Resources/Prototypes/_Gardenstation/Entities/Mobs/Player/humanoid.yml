#gimp
- type: randomHumanoidSettings
  id: CargoGimp
  randomizeName: true
  parent: EventHumanoidMindShielded
  speciesBlacklist:
  - Shadowkin
  - Monkey
  - Kobold
  - Abductor
  components:
     - type: RandomHumanoidAppearance
       randomizeName: true
     - type: GhostRole
       name: Logistics Fanatic
       description: You Are The Twisted Genius (400 Years of Service)
       rules: Do as the LO says. The Company Is Your God.
       raffle:
         settings: short
     - type: GhostTakeoverAvailable
     - type: AutoImplant
       implants:
       - DeathAcidifierImplant
     - type: Loadout
       prototypes: [ CargoGimpGear ]
     - type: RandomMetadata
       nameSegments:
       - fake_human_first
       - names_last

- type: entity
  id: RandomHumanoidSpawnerCargoGimp
  name: Cargo Gimp
  components:
  - type: Sprite
    netsync: false
    sprite: _Gardenstation/Clothing/Mask/white_morpheus.rsi
    state: icon
  - type: RandomMetadata
    nameSegments:
    - fake_human_first
    - names_last
  - type: RandomHumanoidSpawner
    settings: CargoGimp

- type: startingGear
  id: CargoGimpGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitNTTripps
    shoes: ClothingShoesColorBrown
    id: CargoPDA
    ears: ClothingHeadsetCargo
    mask: ClothingMaskTwistedGenius
    gloves: ClothingHandsGlovesCombat
    outerClothing: ClothingOuterVestCargoGimp
    pocket1: AppraisalTool

# umbral path

# URISTS

- type: randomHumanoidSettings
  id: SisterDervish
  randomizeName: false
  parent: EventHumanoid
  speciesBlacklist: # figure out how to make this a girls club later too. no boys allowed in my awesome cult.
  - Shadowkin # there is a solarian saying
  - Monkey
  - Kobold
  - Abductor
  - Diona # they cant wear the shoes. sorry bub maybe next cult.
  - Vox # they die instantly
  - Arachnid # spiders scare me
  - Oni # not psionic
  - Plasmaman # they die instantly
  - IPC # not psionic
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: GhostRole
    name: Umbral Dervish
    description: You are a Dervish of the Umbral Path. You have come to punish those who have put their hands in places they do not belong.
    rules: Follow the word of the Coven and your elder Sisters no matter what. Do not let the brutish ones take you alive. Walk the golden path Yd'Ssath has laid before you.
#    mindRoles:
#     - MindRoleLoneDervish
    raffle:
      settings: short
#  - type: AntagRandomObjectives - not done yet
#    maxDifficulty: 3
#    sets:
#    - maxPicks: 3
#      groups: UmbralSisterObjectiveGroupSolo
  - type: GhostTakeoverAvailable
  - type: Loadout
    prototypes: [ SisterDervishGearSolo ]
  - type: AutoImplant
    implants:
    - DeathAcidifierImplant # turn this into some other bullshit later idkaaay
  - type: Psionic
    powerSlots: 3
    baselinePowerCost: 75
    nextPowerCost: 75
    removable: false
    roller: true
  - type: InnatePsionicPowers
    powersToAdd:
    - NoosphericZapPower
    - PsionicInvisibilityPower
    - TelepathyPower
    - DarkSwapPower
  # - ScrambleCipherPower - finish this for justicar first :P
  - type: RandomMetadata
    nameSegments:
    - names_golem

- type: randomHumanoidSettings
  id: SisterVisage
  randomizeName: false
  parent: SisterDervish
  speciesBlacklist: # figure out how to make this a girls club later too. no boys allowed in my awesome cult.
  - Shadowkin # there is a solarian saying
  - Monkey
  - Kobold
  - Abductor
  - Diona # they cant wear the shoes. sorry bub maybe next cult.
  - Vox # they die instantly
  - Arachnid # spiders scare me
  - Oni # not psionic
  - Plasmaman # they die instantly
  - IPC # not psionic
  components:
  - type: GhostRole
    name: The Visage of Yd'Ssath
    description: You are the hand of Yd'Ssath- blessed be her name. Carry out her will. Open the floodgates and bring glimmer to the eyes of all life.
    rules: You are the hand of Yd'Ssath- blessed be her name. Carry out her will. Suffer not the brutish ones to live.
  - type: Loadout
    prototypes: [ SisterVisageGear ]
  - type: Psionic
    powerSlots: 12
    baselinePowerCost: 40
    nextPowerCost: 20
    removable: false
    roller: true
  - type: InnatePsionicPowers
    powersToAdd:
    - PsionicAssaultPower
    - PsionicInvisibilityPower
    - PowerOverwhelming
    - HealingWordPower
    - XenoglossyPower
    - PsychognomyPower
    - TelepathyPower
    - DarkSwapPower

