    eyes: ClothingEyeSisterDervishBlindfold
    gloves: ClothingHandsGlovesSisterHands
    outerClothing: ClothingOuterSisterDervishRegalia
    belt: OspreySickle
    pocket1: FoodOusianaDustBowl
    pocket2: ShardCrystalPink
