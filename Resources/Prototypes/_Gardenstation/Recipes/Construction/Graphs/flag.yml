#biesel
- type: constructionGraph
  id: BieselBanner
  start: start
  graph:
  - node: start
    edges:
    - to: bieselbannerfull
      steps:
      - material: Cloth
        amount: 4
        doAfter: 2
  - node: bieselbannerfull
    entity: Ar13WallFlagBiesel
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MaterialCloth1
        amount: 3 #returns 1 less as one breaks
      - !type:DeleteEntity {}
      conditions:
      - !type:EntityAnchored
        anchored: true
      steps:
      - tool: Cutting
        doAfter: 2
