- type: job
  id: ConsularOfficer
  name: Consular Officer
  description: "Represent your government, act as a diplomat, ensure your citizens are treated fairly, work with the magistrate to uphold sectoral law, cry to the president when they arrest you"
  playTimeTracker: JobConsularOfficer
  requirements:
  - !type:CharacterDepartmentTimeRequirement
    department: Command
    min: 54000 # 15 hours
  - !type:CharacterTraitRequirement
    inverted: true
    traits:
    #- Foreigner // this might be kinda fun i dunno
    #- ForeignerLight
    - Muted
  - !type:CharacterEmployerRequirement # add government body employers? atleast for major factions anyways
