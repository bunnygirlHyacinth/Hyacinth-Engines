# Externally applied meds

- type: reagent
  id: Psilacrazene
  name: reagent-name-psilacrazene
  group: Medicine
  desc: reagent-desc-psilacrazene
  physicalDesc: reagent-physical-desc-viscous
  flavor: bitter and tingly
  color: "#bbdcab"
  plantMetabolism:
  - !type:PlantAdjustWeeds
    amount: -8
  - !type:PlantAdjustHealth
    amount: -20
  worksOnTheDead: true
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        scaleByQuantity: true
        ignoreResistances: false
        damage:
          types:
            Heat: -1
            Cold: -2
            Caustic: -4 # europan arms. the caustic shells fell like rain.
        conditions:
        - !type:HasComponentOnEquipmentCondition
          components:
          - type: PressureProtection # can't get through this to reach the bodyparts!
          invert: true
  metabolisms:
    Medicine:
      metabolismRate: 3
      effects:
      - !type:HealthChange
        damage:
          types:
            Psionic: -3 # LAST RESORT PSI HEALING
      - !type:HealthChange
        damage:
          types:
            Poison: 1.5
      - !type:ChemVomit
        conditions:
        - !type:ReagentThreshold
          min: 15
        probability: 0.1
      - !type:Emote
        conditions:
        - !type:ReagentThreshold
          min: 20
        emote: Scream
        probability: 0.2
    Narcotic:
      effects:
      - !type:MovespeedModifier
        walkSpeedModifier: 1.25
        sprintSpeedModifier: 1.25
      - !type:GenericStatusEffect # never forget the ospreys
        key: Adrenaline
        component: IgnoreSlowOnDamage
        time: 5
      initializeFunctions:
      - !type:AddPsionicStatSources
        amplificationModifier: 0.25

- type: reagent
  id: KelpPodSlime
  name: reagent-name-kelpslime
  group: Medicine
  desc: reagent-desc-kelpslime
  physicalDesc: reagent-physical-desc-slimy
  flavor: medicine
  color: "#9972fd"
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        damage:
          types:
            Asphyxiation: -1
            Bloodloss: -0.5
            Poison: -0.5
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 35
        damage:
          types:
            Asphyxiation: 0.5
            Poison: 0.5
      - !type:ChemAddMoodlet
       moodPrototype: StrongPainkiller
       conditions:
        - !type:ReagentThreshold
          min: 9
      - !type:GenericStatusEffect
        key: SeeingRainbows
        component: SeeingRainbows
        type: Add
        time: 10 #thavens love getting fucked up probably thats why therye all like that
        refresh: false
    Narcotic:
      effects:
      - !type:PopupMessage
        type: Local
        messages:
        - generic-reagent-effect-kelp-drooling
        - generic-reagent-effect-kelp-stupid
        - generic-reagent-effect-kelp-slow
        - generic-reagent-effect-kelp-seacow
        - generic-reagent-effect-kelp-silly
        - generic-reagent-effect-kelp-bubbles
        - generic-reagent-effect-kelp-more
        - generic-reagent-effect-kelp-good
        - generic-reagent-effect-kelp-pretty
        - generic-reagent-effect-soundgood
        - generic-reagent-effect-euphoria
        conditions:
        - !type:ReagentThreshold
          min: 5
          max: 30
        probability: 0.08
      - !type:PopupMessage
        visualType: LargeCaution
        type: Local
        messages:
        - generic-reagent-effect-kelp-beauty
        - generic-reagent-effect-kelp-weird
        - generic-reagent-effect-kelp-anythinggoes
        - generic-reagent-effect-kelp-punchshit #this happened to me on shrooms once
        - generic-reagent-effect-kelp-scream
        - generic-reagent-effect-disoriented
        - generic-reagent-effect-manic
        - generic-reagent-effect-confused
        - generic-reagent-effect-static
        - generic-reagent-effect-breakthrough
        conditions:
        - !type:ReagentThreshold
          min: 40
        probability: 0.3
